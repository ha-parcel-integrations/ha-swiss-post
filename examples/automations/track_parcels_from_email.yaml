# Extract Swiss Post tracking codes from incoming e-mail and register them
# with `swiss_post.track_parcel`, so parcels start tracking the moment the
# shipping confirmation lands in your inbox — no manual entry.
#
# Requirements:
#   - one or more core IMAP config entries with "text" enabled under
#     "message data" and the max message size raised (carrier mails are
#     long) — full setup guide and pitfalls: track_parcels_from_email.md
#   - optional: an `ai_task` entity for the AI fallback branch; delete
#     the whole `else:` block if you don't use one
#   - PRIVACY: by default this fires on EVERY incoming mail and (with the
#     AI branch) can send mail bodies to your AI Task. Scope the IMAP
#     search to the carrier's sender first — see "Scope & privacy" in the .md.
#
# The regex is deliberately written without backslashes (`(?<![0-9A-Za-z])`
# instead of `\b`, `[0-9]` instead of `\d`): Jinja treats `\b` inside a
# string literal as a backspace escape, so the pattern would silently
# never match.

alias: "Swiss Post: track from e-mail"
description: >-
  Listens to imap_content events from all IMAP entries. Fast regex path for
  Swiss Post tracking codes; optional AI fallback for mails whose layout the
  regex does not recognise.
mode: queued
max: 10

triggers:
  - trigger: event
    event_type: imap_content

variables:
  sender: "{{ trigger.event.data.sender | default('') | lower }}"
  subject: "{{ trigger.event.data.subject | default('') }}"
  body: "{{ trigger.event.data.text | default('') }}"
  content: "{{ subject ~ ' ' ~ body }}"
  # Two shapes: the 18-digit domestic number (often printed with dots or
  # spaces, so the separators are matched and stripped below) and the
  # international S10 form, RR123456789CH.
  swiss_post_codes: >-
    {{ (content | regex_findall('(?<![0-9])(?:99[0-9. ]{16,22})(?![0-9])')
        | map('regex_replace', '[^0-9]', '') | select('match', '^[0-9]{18}$') | list)
       + (content | regex_findall('(?<![0-9A-Za-z])[A-Z]{2}[0-9]{9}CH(?![0-9A-Za-z])') | list)
       | unique | list }}
  # Keyword gate for the AI fallback — localise to your language(s).
  is_parcel_mail: >-
    {{ content | lower is search('pakket|bezorg|track|verzonden|onderweg|zending|shipment|delivery|levering') }}

conditions:
  # initial=true means "new message"; false means a duplicate trigger of
  # the SAME message (e.g. after a reconnect) — requiring it is free dedup.
  - condition: template
    value_template: "{{ trigger.event.data.initial | default(true) }}"
  - condition: template
    value_template: "{{ is_parcel_mail or swiss_post_codes | count > 0 }}"

actions:
  - repeat:
      for_each: "{{ swiss_post_codes }}"
      sequence:
        - action: swiss_post.track_parcel
          data:
            tracking_code: "{{ repeat.item }}"
  - if:
      - condition: template
        value_template: "{{ swiss_post_codes | count > 0 }}"
    then:
      - action: notify.mobile_app_your_phone
        data:
          title: "📦 Swiss Post parcel picked up from mail"
          message: >-
            {{ swiss_post_codes | join(', ') }} (mail from {{ sender }})
    else:
      # ---- Optional AI fallback — delete this block if you have no ai_task entity ----
      - action: ai_task.generate_data
        data:
          task_name: swiss_post-tracking-code-extraction
          entity_id: ai_task.your_ai_task_entity
          instructions: >-
            Below is an e-mail. Determine whether it contains a Swiss Post
            parcel tracking code. Swiss Post codes are either 18 digits
            starting with 99 (often printed in groups, like
            99.60 1234.5678 9012 34) or two letters, nine digits and CH
            (like RR123456789CH). Only return a real tracking
            trace code, never an order, customer or invoice number. If the
            mail is from a different carrier, answer 'other'. When in
            doubt: 'none'.

            Sender: {{ sender }}
            Subject: {{ subject }}
            Body:
            {{ body[:6000] }}
          structure:
            carrier:
              description: Whether a Swiss Post tracking code was found
              required: true
              selector:
                select:
                  options: ["swiss_post", "other", "none"]
            tracking_code:
              description: The tracking code, or empty if none
              required: false
              selector:
                text:
        response_variable: ai_result
      - choose:
          - conditions: "{{ ai_result.data.carrier == 'swiss_post' and (ai_result.data.tracking_code | default('') | trim) != '' }}"
            sequence:
              - action: swiss_post.track_parcel
                data:
                  tracking_code: "{{ ai_result.data.tracking_code | trim }}"
              - action: notify.mobile_app_your_phone
                data:
                  title: "📦 Swiss Post parcel picked up from mail (AI)"
                  message: "{{ ai_result.data.tracking_code | trim }} (mail from {{ sender }})"
          - conditions: "{{ ai_result.data.carrier == 'other' and (ai_result.data.tracking_code | default('') | trim) != '' }}"
            sequence:
              - action: notify.mobile_app_your_phone
                data:
                  title: "📦 Tracking number found – not a Swiss Post parcel"
                  message: "{{ ai_result.data.tracking_code | trim }} (mail from {{ sender }}, subject: {{ subject }})"
