# Notify when a Swiss Post parcel goes out for delivery.

alias: "Swiss Post: out for delivery"
description: Notify when a tracked Swiss Post parcel is loaded for delivery today.
mode: queued
max: 10

triggers:
  - trigger: event
    event_type: swiss_post_parcel_status_changed
    event_data:
      new_status: out_for_delivery

actions:
  - action: notify.mobile_app
    data:
      title: "Swiss Post on the way"
      message: >-
        {{ trigger.event.data.sender or trigger.event.data.barcode }}
        is out for delivery today.
      data:
        clickAction: "{{ trigger.event.data.url }}"
