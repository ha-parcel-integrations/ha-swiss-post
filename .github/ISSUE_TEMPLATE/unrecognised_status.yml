name: 🏷️ Unrecognised parcel status
description: The integration logged a warning asking you to report an unrecognised status or event.
title: "[status] "
labels: ["unrecognised-status"]
assignees:
  - peternijssen
body:
  - type: markdown
    attributes:
      value: |
        Swiss Post's status list, its delivery-window fields and its parcel
        dimensions were all confirmed against a **single** real parcel, so the
        integration deliberately asks for help whenever it meets something new.
        Any of these warnings belongs here:

        - `status=… → reported as 'unknown'` — a status value we do not map yet
        - `reported pickup-point fields (…)` — a parcel waiting at a post
          office, the single biggest gap in the mapping
        - `reported a delivery window (…)` — a parcel with a real time window
        - `we assume length, width, height` — only useful if you know the
          parcel's real size, so we can confirm the order
        - `answered 204` — the event-history request format changed

        Paste the full line below. It contains no address or recipient data —
        the integration logs field names, never their values.
  - type: textarea
    id: logline
    attributes:
      label: The log line
      description: Copy the full warning line from your Home Assistant log.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Integration version
      placeholder: "e.g. 0.9.0"
    validations:
      required: true
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      placeholder: "e.g. 2026.7.0"
  - type: markdown
    attributes:
      value: |
        ### 💡 Even better: attach a diagnostics file

        A diagnostics download shows us the exact payload behind the warning —
        usually all we need to fix the mapping, with no back-and-forth.

        1. In Home Assistant, open **Settings → Devices & services**.
        2. Open this integration, then click the **⋮** (three dots) on its entry.
        3. Choose **Download diagnostics**.
        4. Open the file and check it before attaching. Home Assistant redacts
           known personal fields, but that list is per-integration and can
           miss something an API happens to return in an unlisted place (a
           name, an address, a link containing a tracking number). Please
           hand-redact anything that still looks personal.
        5. Drag the file onto this issue to attach it.
